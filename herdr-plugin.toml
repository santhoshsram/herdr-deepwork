id = "santhoshsram.deepwork"
name = "Deep Work"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Cuts unnecessary context switching: stay with one agent long enough to make real progress"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "open"
title = "Open Deep Work"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin santhoshsram.deepwork --entrypoint panel"]

[[panes]]
id = "panel"
title = "Focus timer"
placement = "popup"
width = 50
height = 13
command = ["sh", "-c", "exec \"$HOME/.local/state/herdr/plugins/santhoshsram.deepwork/herdr-deepwork\" panel"]
